<style>
  /* ---------- Design tokens (shared with About + Services) ---------- */
  #cl-home {
    --ink: #12100c; --paper: #f7f4ee; --paper-2: #efe9df;
    --gold: #d9a441; --gold-deep: #b07f22;
    --line: rgba(18, 16, 12, .12);
    --radius: 18px; --ease-out: cubic-bezier(.16, 1, .3, 1);
    font-family: 'Archivo', system-ui, -apple-system, sans-serif;
    color: var(--ink); background: var(--paper); line-height: 1.6;
    width: 100%; max-width: 100vw; overflow-x: hidden;
  }
  #cl-home *, #cl-home *::before, #cl-home *::after { box-sizing: border-box; margin: 0; min-width: 0; }
  #cl-home img { max-width: 100%; display: block; }
  /* Theme-bleed guard: every text element inherits its section's colour */
  #cl-home :is(h1,h2,h3,h4,p,blockquote,summary,cite,small,li,figcaption,span,div,b,strong,em) { color: inherit; }
  #cl-home .cl-wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }
  #cl-home h1, #cl-home h2, #cl-home h3 { line-height: 1.06; font-weight: 800; letter-spacing: -.02em; }
  #cl-home .cl-serif { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-style: italic; }
  #cl-home a { color: inherit; }

  #cl-home .cl-kicker {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 12.5px; font-weight: 800; letter-spacing: .24em; text-transform: uppercase;
    color: var(--gold-deep); margin-bottom: 14px;
  }
  #cl-home .cl-kicker::before { content: ""; width: 32px; height: 2px; background: var(--gold); }
  #cl-home .cl-section { padding: clamp(64px, 8vw, 110px) 0; position: relative; }
  #cl-home .cl-section h2 { font-size: clamp(30px, 4.6vw, 50px); margin-bottom: 14px; }
  #cl-home .cl-lede { font-size: clamp(16px, 2vw, 19px); max-width: 62ch; color: rgba(18,16,12,.78); }
  #cl-home .cl-dark { background: linear-gradient(180deg, #17161c, #0f0e13); color: var(--paper); }
  #cl-home .cl-dark .cl-kicker { color: var(--gold); }
  #cl-home .cl-dark .cl-lede { color: rgba(247,244,238,.8); }

  /* ---------- Buttons ---------- */
  #cl-home .cl-btn {
    display: inline-block; padding: 17px 36px; border-radius: 999px; text-decoration: none;
    font-weight: 800; font-size: 15.5px; letter-spacing: .01em; background: #17161c; color: var(--paper);
    transition: transform .3s var(--ease-out), box-shadow .3s; box-shadow: 0 20px 40px -18px rgba(18,16,12,.5);
  }
  #cl-home .cl-btn:hover { transform: translateY(-3px); }
  #cl-home .cl-btn--gold { background: linear-gradient(140deg, var(--gold), var(--gold-deep)); color: #17140c; box-shadow: 0 20px 40px -16px rgba(176,127,34,.65); }
  #cl-home .cl-btn--ghost { background: transparent; border: 2px solid rgba(247,244,238,.42); color: var(--paper); box-shadow: none; }
  #cl-home .cl-btn--ghost:hover { border-color: var(--gold); color: var(--gold); }
  #cl-home .cl-btn--dark-ghost { background: transparent; border: 2px solid var(--line); color: var(--ink); box-shadow: none; }
  #cl-home .cl-btn--dark-ghost:hover { border-color: var(--gold); color: var(--gold-deep); }
  #cl-home .cl-btn-row { display: flex; flex-wrap: wrap; gap: 13px; margin-top: 28px; }
  #cl-home .cl-btn-row--center { justify-content: center; }

  /* ---------- HERO (split editorial — deliberately unlike the About page) ---------- */
  #cl-home .cl-hero {
    position: relative; min-height: 94vh; min-height: 94svh; display: flex; align-items: center;
    overflow: hidden; padding: 130px 0 96px; color: var(--paper); background: #0c0b10;
  }
  #cl-home .cl-video-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
  /* Weighted to the left so the copy column stays readable and the photo side breathes */
  #cl-home .cl-scrim {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background:
      linear-gradient(97deg, rgba(12,11,16,.95) 0%, rgba(12,11,16,.88) 34%, rgba(12,11,16,.42) 62%, rgba(12,11,16,.66) 100%),
      linear-gradient(180deg, rgba(12,11,16,.45) 0%, transparent 30%, rgba(12,11,16,.8) 100%);
  }
  /* ---------- Brand lockup: the logo leads the page ---------- */
  #cl-home .cl-logo {
    display: block; width: clamp(230px, 30vw, 430px); margin-bottom: 22px;
    animation: cl-logo-in 1s var(--ease-out) both;
  }
  @keyframes cl-logo-in { from { opacity: 0; transform: translateY(-14px) scale(.97) } to { opacity: 1; transform: none } }
  #cl-home .cl-logo img { width: 100%; height: auto; display: block; opacity: 0; transition: opacity .45s ease; }
  #cl-home .cl-logo img.is-loaded { opacity: 1; }
  /* Styled stand-in until the real logo file is uploaded — keeps the brand
     present instead of a blank space, and disappears the moment it loads. */
  #cl-home .cl-logo.has-photo .cl-logo-fallback { display: none; }
  #cl-home .cl-logo-fallback { display: block; border: 3px solid var(--gold); padding: 16px 22px 30px; position: relative; }
  #cl-home .cl-logo-word {
    display: block; font-weight: 900; font-size: clamp(30px, 4.6vw, 58px); line-height: .9;
    letter-spacing: -.02em; text-transform: uppercase; text-align: center;
    background: linear-gradient(100deg, #b07f22, #f0cf7a 45%, #d9a441);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #cl-home .cl-logo-ribbon {
    position: absolute; left: -8px; right: -8px; bottom: -2px; padding: 7px 0;
    background: linear-gradient(100deg, #d9a441, #f0cf7a 50%, #b07f22);
    color: #17140c; font-weight: 800; font-size: clamp(11px, 1.5vw, 16px);
    letter-spacing: .3em; text-transform: uppercase; text-align: center;
  }

  /* Thin gold rule that sweeps in under the eyebrow */
  #cl-home .cl-hero-rule { display: block; width: 68px; height: 3px; background: var(--gold); margin-bottom: 22px; transform-origin: left; animation: cl-rule 1s var(--ease-out) both; }
  @keyframes cl-rule { from { transform: scaleX(0) } to { transform: scaleX(1) } }

  #cl-home .cl-hero-inner {
    position: relative; z-index: 3; width: 100%; max-width: 1180px; margin: 0 auto; padding: 0 24px;
    display: grid; grid-template-columns: 1.06fr .94fr; gap: clamp(30px, 5vw, 64px); align-items: center; text-align: left;
  }
  /* copy always paints above the floating cards, however narrow the window gets */
  #cl-home .cl-hero-copy { position: relative; z-index: 2; }
  #cl-home .cl-hero .cl-kicker { color: var(--gold); }
  #cl-home .cl-hero h1 { font-size: clamp(42px, 6.6vw, 88px); text-transform: uppercase; letter-spacing: -.035em; line-height: .92; }
  #cl-home .cl-hero h1 .ln { display: block; opacity: 0; transform: translateY(26px) rotateX(14deg); animation: cl-line-in .9s var(--ease-out) forwards; }
  #cl-home .cl-hero h1 .ln:nth-child(1) { animation-delay: .12s }
  #cl-home .cl-hero h1 .ln:nth-child(2) { animation-delay: .26s }
  #cl-home .cl-hero h1 .ln:nth-child(3) { animation-delay: .4s; color: var(--gold); }
  @keyframes cl-line-in { to { opacity: 1; transform: none } }
  #cl-home .cl-hero .cl-hero-serif {
    font-family: 'Fraunces', Georgia, serif; font-style: italic; font-weight: 700;
    font-size: clamp(19px, 2.5vw, 27px); color: var(--paper); margin-top: 16px; line-height: 1.25;
  }
  #cl-home .cl-hero p.cl-hero-sub { max-width: 50ch; margin: 14px 0 0; font-size: clamp(15px, 1.75vw, 17.5px); color: rgba(247,244,238,.82); }
  #cl-home .cl-hero .cl-btn-row { justify-content: flex-start; }

  /* Above-the-fold trust chips */
  #cl-home .cl-trustchips { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 24px; }
  #cl-home .cl-trustchips span {
    display: inline-flex; align-items: center; gap: 7px; padding: 9px 15px; border-radius: 999px;
    font-size: 12.5px; font-weight: 800; letter-spacing: .02em;
    color: var(--paper); background: rgba(12,11,16,.5); border: 1px solid rgba(217,164,65,.5);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  #cl-home .cl-trustchips b { color: var(--gold); font-weight: 900; }

  /* ---------- Hero proof stack: floating 3D project cards ---------- */
  #cl-home .cl-proof { position: relative; aspect-ratio: 1 / 1.02; perspective: 1200px; }
  #cl-home .cl-proof-card {
    position: absolute; border-radius: 16px; overflow: hidden; background: #1d1c23;
    border: 1px solid rgba(247,244,238,.16); box-shadow: 0 40px 80px -30px rgba(0,0,0,.85);
    will-change: transform; transition: transform .5s var(--ease-out);
  }
  #cl-home .cl-proof-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .5s ease; }
  #cl-home .cl-proof-card img.is-loaded { opacity: 1; }
  #cl-home .cl-proof-card .cl-slot-label {
    position: absolute; inset: 0; display: grid; place-items: center; padding: 14px; text-align: center;
    color: rgba(247,244,238,.4); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase;
  }
  #cl-home .cl-proof-card.has-photo .cl-slot-label { display: none; }
  #cl-home .cl-proof-card b {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; padding: 34px 16px 13px;
    background: linear-gradient(transparent, rgba(12,11,16,.94) 62%);
    font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--paper);
  }
  /* every child of a card is absolutely positioned, so the card needs an explicit
     aspect-ratio or it collapses to zero height */
  #cl-home .cl-proof-1 { width: 58%; aspect-ratio: 4 / 5; top: 1%; left: 6%; transform: rotate(-4deg); }
  #cl-home .cl-proof-2 { width: 60%; aspect-ratio: 4 / 3.2; bottom: 2%; right: 0; transform: rotate(3.5deg); }
  #cl-home .cl-proof-badge {
    position: absolute; z-index: 4; right: 4%; top: 6%; padding: 15px 19px; border-radius: 16px;
    background: rgba(247,244,238,.97); color: var(--ink); text-align: center;
    box-shadow: 0 30px 60px -22px rgba(0,0,0,.75); will-change: transform;
  }
  #cl-home .cl-proof-badge b { display: block; font-size: 30px; font-weight: 900; color: var(--gold-deep); line-height: 1; letter-spacing: -.03em; }
  #cl-home .cl-proof-badge .cl-stars { display: block; font-size: 12px; letter-spacing: 2px; margin-top: 3px; }
  #cl-home .cl-proof-badge small { display: block; font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: rgba(18,16,12,.6); margin-top: 4px; }

  #cl-home .cl-scroll-cue {
    position: absolute; left: 50%; bottom: 18px; z-index: 3; transform: translateX(-50%);

  }
  @keyframes cl-drip { 0% { transform: translateX(-50%) scaleY(0); transform-origin: top } 55% { transform: translateX(-50%) scaleY(1); transform-origin: top } 56% { transform-origin: bottom } 100% { transform: translateX(-50%) scaleY(0); transform-origin: bottom } }

  /* ---------- Reveals (3D flip-up) ---------- */
