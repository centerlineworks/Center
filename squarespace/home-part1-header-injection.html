<style>
  /* ---------- Design tokens (shared with About + Services) ---------- */
  #cl-home {
    --ink: #12100c; --paper: #f7f4ee; --paper-2: #efe9df;
    --gold: #d9a441; --gold-deep: #b07f22;
    --line: rgba(18, 16, 12, .12);
    --radius: 18px; --ease-out: cubic-bezier(.16, 1, .3, 1);
    font-family: 'Archivo', system-ui, -apple-system, sans-serif;
    color: var(--ink); background: var(--paper); line-height: 1.6;
    width: 100%; max-width: 100vw; overflow-x: hidden;
  }
  #cl-home *, #cl-home *::before, #cl-home *::after { box-sizing: border-box; margin: 0; min-width: 0; }
  #cl-home img { max-width: 100%; display: block; }
  /* Theme-bleed guard: every text element inherits its section's colour */
  #cl-home :is(h1,h2,h3,h4,p,blockquote,summary,cite,small,li,figcaption,span,div,b,strong,em) { color: inherit; }
  #cl-home .cl-wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }
  #cl-home h1, #cl-home h2, #cl-home h3 { line-height: 1.06; font-weight: 800; letter-spacing: -.02em; }
  #cl-home .cl-serif { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-style: italic; }
  #cl-home a { color: inherit; }

  #cl-home .cl-kicker {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 12.5px; font-weight: 800; letter-spacing: .24em; text-transform: uppercase;
    color: var(--gold-deep); margin-bottom: 14px;
  }
  #cl-home .cl-kicker::before { content: ""; width: 32px; height: 2px; background: var(--gold); }
  #cl-home .cl-section { padding: clamp(64px, 8vw, 110px) 0; position: relative; }
  #cl-home .cl-section h2 { font-size: clamp(30px, 4.6vw, 50px); margin-bottom: 14px; }
  #cl-home .cl-lede { font-size: clamp(16px, 2vw, 19px); max-width: 62ch; color: rgba(18,16,12,.78); }
  #cl-home .cl-dark { background: linear-gradient(180deg, #17161c, #0f0e13); color: var(--paper); }
  #cl-home .cl-dark .cl-kicker { color: var(--gold); }
  #cl-home .cl-dark .cl-lede { color: rgba(247,244,238,.8); }

  /* ---------- Buttons ---------- */
  #cl-home .cl-btn {
    display: inline-block; padding: 17px 36px; border-radius: 999px; text-decoration: none;
    font-weight: 800; font-size: 15.5px; letter-spacing: .01em; background: #17161c; color: var(--paper);
    transition: transform .3s var(--ease-out), box-shadow .3s; box-shadow: 0 20px 40px -18px rgba(18,16,12,.5);
  }
  #cl-home .cl-btn:hover { transform: translateY(-3px); }
  #cl-home .cl-btn--gold { background: linear-gradient(140deg, var(--gold), var(--gold-deep)); color: #17140c; box-shadow: 0 20px 40px -16px rgba(176,127,34,.65); }
  #cl-home .cl-btn--ghost { background: transparent; border: 2px solid rgba(247,244,238,.42); color: var(--paper); box-shadow: none; }
  #cl-home .cl-btn--ghost:hover { border-color: var(--gold); color: var(--gold); }
  #cl-home .cl-btn--dark-ghost { background: transparent; border: 2px solid var(--line); color: var(--ink); box-shadow: none; }
  #cl-home .cl-btn--dark-ghost:hover { border-color: var(--gold); color: var(--gold-deep); }
  #cl-home .cl-btn-row { display: flex; flex-wrap: wrap; gap: 13px; margin-top: 28px; }
  #cl-home .cl-btn-row--center { justify-content: center; }

  /* ---------- HERO ---------- */
  #cl-home .cl-hero {
    position: relative; min-height: 92vh; min-height: 92svh; display: grid; place-items: center;
    text-align: center; overflow: hidden; padding: 132px 24px 96px; color: var(--paper);
    background: radial-gradient(120% 90% at 50% 0%, #23222a 0%, #131218 55%, #0c0b10 100%);
    perspective: 1000px;
  }
  #cl-home .cl-video-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
  #cl-home .cl-scrim {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(180deg, rgba(12,11,16,.74) 0%, rgba(12,11,16,.55) 42%, rgba(12,11,16,.93) 100%);
  }
  /* 3D blueprint floor */
  #cl-home .cl-grid3d {
    position: absolute; inset: -60% -30%; z-index: 1; pointer-events: none;
    background-image:
      linear-gradient(rgba(217,164,65,.16) 1px, transparent 1px),
      linear-gradient(90deg, rgba(217,164,65,.16) 1px, transparent 1px);
    background-size: 58px 58px;
    transform: rotateX(63deg) translateZ(-140px); transform-origin: 50% 100%;
    mask-image: radial-gradient(72% 62% at 50% 58%, #000 28%, transparent 78%);
    -webkit-mask-image: radial-gradient(72% 62% at 50% 58%, #000 28%, transparent 78%);
    will-change: transform;
  }
  /* Signature rotating wireframe house (ties the site together) */
  #cl-home .cl-house-stage { position: absolute; inset: 0; z-index: 1; display: grid; place-items: center; pointer-events: none; perspective: 1100px; }
  #cl-home .cl-house { position: relative; width: 250px; height: 200px; transform-style: preserve-3d; opacity: .42; will-change: transform; }
  #cl-home .cl-house i { position: absolute; border: 1.5px solid rgba(217,164,65,.8); background: rgba(217,164,65,.05); }
  #cl-home .cl-house .f1 { width: 250px; height: 145px; bottom: 0; transform: translateZ(85px); }
  #cl-home .cl-house .f2 { width: 250px; height: 145px; bottom: 0; transform: translateZ(-85px); }
  #cl-home .cl-house .f3 { width: 170px; height: 145px; bottom: 0; left: -85px; transform: rotateY(90deg); transform-origin: right; }
  #cl-home .cl-house .f4 { width: 170px; height: 145px; bottom: 0; right: -85px; transform: rotateY(-90deg); transform-origin: left; }
  #cl-home .cl-house .r1 { width: 250px; height: 150px; bottom: 137px; transform-origin: bottom; transform: translateZ(85px) rotateX(56deg); }
  #cl-home .cl-house .r2 { width: 250px; height: 150px; bottom: 137px; transform-origin: bottom; transform: translateZ(-85px) rotateX(-56deg); }
  #cl-home .cl-house .d1 { width: 46px; height: 82px; bottom: 0; left: 102px; transform: translateZ(86px); }
  #cl-home .cl-house .w1 { width: 42px; height: 42px; bottom: 62px; left: 28px; transform: translateZ(86px); }
  #cl-home .cl-house .w2 { width: 42px; height: 42px; bottom: 62px; right: 28px; transform: translateZ(86px); }

  #cl-home .cl-hero-inner { position: relative; z-index: 3; max-width: 940px; }
  #cl-home .cl-hero .cl-kicker { color: var(--gold); justify-content: center; }
  #cl-home .cl-hero h1 { font-size: clamp(40px, 7.4vw, 82px); text-transform: uppercase; letter-spacing: -.025em; }
  #cl-home .cl-hero h1 .cl-serif { display: block; text-transform: none; color: var(--gold); font-size: .52em; letter-spacing: 0; margin-top: 6px; }
  #cl-home .cl-hero p.cl-hero-sub { max-width: 60ch; margin: 18px auto 0; font-size: clamp(15.5px, 1.9vw, 18.5px); color: rgba(247,244,238,.86); }
  #cl-home .cl-hero .cl-btn-row { justify-content: center; }

  /* Above-the-fold trust chips */
  #cl-home .cl-trustchips { display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; margin-top: 26px; }
  #cl-home .cl-trustchips span {
    display: inline-flex; align-items: center; gap: 7px; padding: 9px 15px; border-radius: 999px;
    font-size: 12.5px; font-weight: 800; letter-spacing: .02em;
    color: var(--paper); background: rgba(12,11,16,.5); border: 1px solid rgba(217,164,65,.5);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  #cl-home .cl-trustchips b { color: var(--gold); font-weight: 900; }
  #cl-home .cl-scroll-cue {
    position: absolute; left: 50%; bottom: 18px; z-index: 3; transform: translateX(-50%);
    width: 1px; height: 40px; background: linear-gradient(var(--gold), transparent);
    animation: cl-drip 1.9s var(--ease-out) infinite;
  }
  @keyframes cl-drip { 0% { transform: translateX(-50%) scaleY(0); transform-origin: top } 55% { transform: translateX(-50%) scaleY(1); transform-origin: top } 56% { transform-origin: bottom } 100% { transform: translateX(-50%) scaleY(0); transform-origin: bottom } }

  /* ---------- Reveals (3D flip-up) ---------- */
  #cl-home .cl-reveal {
    opacity: 0; transform: perspective(900px) rotateX(9deg) translateY(38px); transform-origin: top center;
    transition: opacity .8s var(--ease-out), transform .8s var(--ease-out);
  }
  #cl-home .cl-reveal.is-in { opacity: 1; transform: perspective(900px) rotateX(0) translateY(0); }

  /* ---------- Stat bar ---------- */
  #cl-home .cl-stats { background: var(--paper-2); padding: 34px 0; border-block: 1px solid var(--line); }
  #cl-home .cl-stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; text-align: center; }
