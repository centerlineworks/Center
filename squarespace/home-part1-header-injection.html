<style>
  /* ---------- Design tokens (shared with About + Services) ---------- */
  #cl-home {

    font-family: 'Archivo', system-ui, -apple-system, sans-serif;
    color: var(--ink); background: var(--paper); line-height: 1.6;
    width: 100%; max-width: 100vw; overflow-x: hidden;
  }
  #cl-home *, #cl-home *::before, #cl-home *::after { box-sizing: border-box; margin: 0; min-width: 0; }
  /* No image on this page ever wants a theme-supplied background behind it —
     transparent PNGs would show it as a solid slab. Backgrounds live on the
     figure/wrapper around a photo, never on the <img> itself. */
  #cl-home img { max-width: 100%; display: block; background-color: transparent; }
  /* Theme-bleed guard: every text element inherits its section's colour */
  #cl-home :is(h1,h2,h3,h4,p,blockquote,summary,cite,small,li,figcaption,span,div,b,strong,em) { color: inherit; }
  #cl-home .cl-wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }
  #cl-home h1, #cl-home h2, #cl-home h3 { line-height: 1.06; font-weight: 800; letter-spacing: -.02em; }
  #cl-home .cl-serif { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-style: italic; }
  #cl-home a { color: inherit; }

  #cl-home .cl-kicker {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 12.5px; font-weight: 800; letter-spacing: .24em; text-transform: uppercase;
    color: var(--gold-deep); margin-bottom: 14px;
  }
  #cl-home .cl-kicker::before { content: ""; width: 32px; height: 2px; background: var(--gold); }
  #cl-home .cl-section { padding: clamp(64px, 8vw, 110px) 0; position: relative; }
  #cl-home .cl-section h2 { font-size: clamp(30px, 4.6vw, 50px); margin-bottom: 14px; }
  #cl-home .cl-lede { font-size: clamp(16px, 2vw, 19px); max-width: 62ch; color: rgba(18,16,12,.78); }
  #cl-home .cl-dark { background: linear-gradient(180deg, #17161c, #0f0e13); color: var(--paper); }
  #cl-home .cl-dark .cl-kicker { color: var(--gold); }
  #cl-home .cl-dark .cl-lede { color: rgba(247,244,238,.8); }

  /* ---------- Buttons ---------- */
  #cl-home .cl-btn {
    display: inline-block; padding: 17px 36px; border-radius: 999px; text-decoration: none;
    font-weight: 800; font-size: 15.5px; letter-spacing: .01em; background: #17161c; color: var(--paper);
    transition: transform .3s var(--ease-out), box-shadow .3s; box-shadow: 0 20px 40px -18px rgba(18,16,12,.5);
  }
  #cl-home .cl-btn:hover { transform: translateY(-3px); }
  #cl-home .cl-btn--gold { background: linear-gradient(140deg, var(--gold), var(--gold-deep)); color: #17140c; box-shadow: 0 20px 40px -16px rgba(176,127,34,.65); }
  #cl-home .cl-btn--ghost { background: transparent; border: 2px solid rgba(247,244,238,.42); color: var(--paper); box-shadow: none; }
  #cl-home .cl-btn--ghost:hover { border-color: var(--gold); color: var(--gold); }
  #cl-home .cl-btn--dark-ghost { background: transparent; border: 2px solid var(--line); color: var(--ink); box-shadow: none; }
  #cl-home .cl-btn--dark-ghost:hover { border-color: var(--gold); color: var(--gold-deep); }
  #cl-home .cl-btn-row { display: flex; flex-wrap: wrap; gap: 13px; margin-top: 28px; }
  #cl-home .cl-btn-row--center { justify-content: center; }

  /* ---------- HERO (centred, logo-led) ---------- */
  #cl-home .cl-hero {
    position: relative; min-height: 94vh; min-height: 94svh; display: grid; place-items: center;
    text-align: center; overflow: hidden; padding: 130px 24px 96px; color: var(--paper); background: #0c0b10;
  }
  #cl-home .cl-video-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
  #cl-home .cl-scrim {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;

  /* ---------- Logo: dropped in as-is, never recreated ----------
     The Squarespace theme likes to paint a background (and sometimes a border or
     radius) onto images inside code blocks, which shows up as a white slab behind
     a transparent PNG. Nothing here ever wants that, so it is forced off. */
  #cl-home .cl-logo,
  #cl-home .cl-logo img {
    background: none !important; background-color: transparent !important;
    border: 0 !important; box-shadow: none !important; border-radius: 0 !important;
    padding: 0 !important; outline: 0 !important;
  }
  #cl-home .cl-logo { display: block; width: clamp(280px, 52vw, 680px); margin: 0 auto 30px; }
  #cl-home .cl-logo img { width: 100%; height: auto; display: block; opacity: 0; transition: opacity .5s ease; }
  #cl-home .cl-logo img.is-loaded { opacity: 1; }
  /* plain upload reminder — only visible until the real file exists, and

  #cl-home .cl-logo-note {
    display: block; border: 1px dashed rgba(217,164,65,.55); border-radius: 10px; padding: 24px 18px;

  @keyframes cl-line-in { to { opacity: 1; transform: none } }
  #cl-home .cl-hero p.cl-hero-sub { max-width: 62ch; margin: 20px auto 0; font-size: clamp(15.5px, 1.9vw, 18.5px); color: rgba(247,244,238,.86); }
  #cl-home .cl-hero .cl-btn-row { justify-content: center; }

  #cl-home .cl-trustchips { display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; margin-top: 26px; }

    display: inline-flex; align-items: center; gap: 7px; padding: 9px 15px; border-radius: 999px;
    font-size: 12.5px; font-weight: 800; letter-spacing: .02em;
    color: var(--paper); background: rgba(12,11,16,.5); border: 1px solid rgba(217,164,65,.5);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  #cl-home .cl-trustchips b { color: var(--gold); font-weight: 900; }

  #cl-home .cl-scroll-cue {
    position: absolute; left: 50%; bottom: 18px; z-index: 3; transform: translateX(-50%);
    width: 1px; height: 40px; background: linear-gradient(var(--gold), transparent);
    animation: cl-drip 1.9s var(--ease-out) infinite;
  }
  @keyframes cl-drip { 0% { transform: translateX(-50%) scaleY(0); transform-origin: top } 55% { transform: translateX(-50%) scaleY(1); transform-origin: top } 56% { transform-origin: bottom } 100% { transform: translateX(-50%) scaleY(0); transform-origin: bottom } }

  /* ---------- Reveals (3D flip-up) ---------- */
  #cl-home .cl-reveal {
    opacity: 0; transform: perspective(900px) rotateX(9deg) translateY(38px); transform-origin: top center;
    transition: opacity .8s var(--ease-out), transform .8s var(--ease-out);
  }
  #cl-home .cl-reveal.is-in { opacity: 1; transform: perspective(900px) rotateX(0) translateY(0); }

  /* ---------- Stat bar ---------- */
  #cl-home .cl-stats { background: var(--paper-2); padding: 34px 0; border-block: 1px solid var(--line); }
  #cl-home .cl-stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; text-align: center; }

    position: relative; aspect-ratio: 4 / 3; border-radius: var(--radius); overflow: hidden;
    background: linear-gradient(150deg, #2b2b33, #17161c); border: 1px solid rgba(18,16,12,.08);
    cursor: zoom-in; transition: box-shadow .4s var(--ease-out);
  }
  #cl-home .cl-shot:hover { box-shadow: 0 30px 56px -24px rgba(18,16,12,.45); }
  #cl-home .cl-shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .4s ease, transform .6s var(--ease-out); }
  #cl-home .cl-shot img.is-loaded { opacity: 1; }
  #cl-home .cl-shot:not(.has-before):hover img.cl-shot-after.is-loaded { transform: scale(1.06); }
  #cl-home .cl-shot .cl-slot-label {
    position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center;
    color: rgba(247,244,238,.45); font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase;
  }
  #cl-home .cl-shot.has-photo .cl-slot-label { display: none; }
  #cl-home .cl-shot.has-before { cursor: ew-resize; }
  #cl-home .cl-shot-before { z-index: 2; clip-path: inset(0 100% 0 0); pointer-events: none; }
  #cl-home .cl-ba-handle {
    position: absolute; top: 0; bottom: 0; left: 0; width: 2px; background: var(--gold); z-index: 3;
    pointer-events: none; opacity: 0; box-shadow: 0 0 14px rgba(217,164,65,.9);
  }
  #cl-home .cl-shot.is-comparing .cl-ba-handle { opacity: 1; }
  #cl-home .cl-ba-handle::after {
    content: "\2039\203A"; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 30px; height: 30px; border-radius: 50%; background: var(--gold); color: #17140c;
    display: grid; place-items: center; font-size: 13px; font-weight: 800; letter-spacing: -1px;
  }
  #cl-home .cl-ba-tag {
    position: absolute; top: 14px; left: 14px; z-index: 4; padding: 6px 13px; border-radius: 999px;
    background: rgba(12,11,16,.75); font-size: 10.5px; font-weight: 800; letter-spacing: .16em;
    text-transform: uppercase; color: var(--paper); display: grid; pointer-events: none;
  }
  #cl-home .cl-shot:not(.has-before) .cl-ba-tag { display: none; }
  #cl-home .cl-ba-tag span { grid-area: 1 / 1; transition: opacity .3s; }
  #cl-home .cl-ba-tag .ta { color: var(--gold); opacity: 1; }
  #cl-home .cl-ba-tag .tb { opacity: 0; }
  #cl-home .cl-shot.is-comparing .cl-ba-tag .ta { opacity: 0; }
  #cl-home .cl-shot.is-comparing .cl-ba-tag .tb { opacity: 1; }
  #cl-home .cl-work-hint { margin-top: 14px; text-align: center; font-size: 11.5px; letter-spacing: .2em; text-transform: uppercase; color: rgba(18,16,12,.45); }

  /* ---------- Values (3D tilt cards) ---------- */
  #cl-home .cl-values { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 42px; perspective: 1300px; }
  #cl-home .cl-value {
    background: rgba(247,244,238,.05); border: 1px solid rgba(247,244,238,.14); border-radius: var(--radius);
    padding: 32px 28px; transform-style: preserve-3d; will-change: transform;
    transition: transform .4s var(--ease-out), border-color .4s;
  }
  #cl-home .cl-value:hover { border-color: rgba(217,164,65,.55); }
  #cl-home .cl-value .cl-ico {
    width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center;
    background: linear-gradient(140deg, var(--gold), var(--gold-deep)); color: #17161c;
    margin-bottom: 18px; transform: translateZ(32px);
  }
  #cl-home .cl-value h3 { font-size: 21px; margin-bottom: 9px; transform: translateZ(22px); }
  #cl-home .cl-value p { font-size: 15px; color: rgba(247,244,238,.76); transform: translateZ(12px); }

  /* ---------- Process ---------- */
  #cl-home .cl-process { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 40px; counter-reset: step; }
  #cl-home .cl-step { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 30px 26px; }
  #cl-home .cl-step b { display: block; font-size: 12px; letter-spacing: .18em; color: var(--gold-deep); margin-bottom: 9px; }
  #cl-home .cl-step h3 { font-size: 20px; margin-bottom: 8px; }
  #cl-home .cl-step p { font-size: 14.5px; color: rgba(18,16,12,.72); }

  /* ---------- Owner (video-led, offset editorial — not the About page's portrait+cameo) ---------- */
  #cl-home .cl-owner { display: grid; grid-template-columns: .82fr 1.18fr; gap: clamp(28px, 4.5vw, 60px); align-items: center; }
  /* Portrait frame at the reel's native 9:16 — anything shorter cover-crops the top
     and bottom off the vertical phone footage and cuts people's heads out of shot.
     Watermarks and letterbox bars are handled in the encode, not by cropping here. */
  #cl-home .cl-owner-video {
    position: relative; border-radius: var(--radius); overflow: hidden; aspect-ratio: 9 / 16;
    max-width: 400px; margin-inline: auto; width: 100%;
    background: #1d1c23; border: 1px solid rgba(247,244,238,.16);
    box-shadow: 0 44px 84px -34px rgba(0,0,0,.8);
  }
  #cl-home .cl-owner-video video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #cl-home .cl-owner-video .cl-vtag {
    position: absolute; z-index: 2; left: 16px; top: 16px; padding: 8px 15px; border-radius: 999px;
    background: rgba(12,11,16,.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--gold);
    display: inline-flex; align-items: center; gap: 8px;
  }
  #cl-home .cl-owner-video .cl-vtag i {
    width: 7px; height: 7px; border-radius: 50%; background: var(--gold); font-style: normal;
    animation: cl-pulse 1.9s ease-in-out infinite;
  }
  @keyframes cl-pulse { 0%,100% { opacity: 1; transform: scale(1) } 50% { opacity: .35; transform: scale(.75) } }

  /* Photo strip under the copy — three flat thumbnails, no overlap */
  #cl-home .cl-owner-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 11px; margin-top: 24px; }
  #cl-home .cl-owner-strip figure {
    position: relative; aspect-ratio: 1 / 1; border-radius: 12px; overflow: hidden; cursor: zoom-in;
    background: #24232b; border: 1px solid rgba(247,244,238,.14);
    transition: transform .35s var(--ease-out), border-color .35s;
  }
  #cl-home .cl-owner-strip figure:hover { transform: translateY(-4px); border-color: rgba(217,164,65,.6); }
  #cl-home .cl-owner-strip img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .4s ease; }
  #cl-home .cl-owner-strip img.is-loaded { opacity: 1; }
  #cl-home .cl-owner-strip .cl-slot-label {
    position: absolute; inset: 0; display: grid; place-items: center; padding: 10px; text-align: center;
    color: rgba(247,244,238,.4); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase;
  }
  #cl-home .cl-owner-strip figure.has-photo .cl-slot-label { display: none; }
  #cl-home .cl-owner-badges { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 20px; }
  #cl-home .cl-owner-badges :is(span, a) {
    padding: 9px 15px; border-radius: 999px; font-size: 12.5px; font-weight: 700;
    border: 1px solid rgba(217,164,65,.45); color: var(--gold); background: rgba(217,164,65,.08);
  }
  #cl-home .cl-owner-badges a {
    text-decoration: none; display: inline-flex; align-items: center; gap: 7px;
    transition: background .3s, border-color .3s, transform .3s var(--ease-out);
  }
  #cl-home .cl-owner-badges a:hover,
  #cl-home .cl-owner-badges a:focus-visible {
    background: rgba(217,164,65,.2); border-color: var(--gold); transform: translateY(-2px);
  }
  #cl-home .cl-owner-badges a::after { content: "↗"; font-size: 11px; opacity: .8; }
  #cl-home blockquote.cl-pull {
    font-family: 'Fraunces', Georgia, serif; font-style: italic; font-size: clamp(17px, 2.1vw, 21px);
    line-height: 1.45; border-left: 3px solid var(--gold); padding-left: 18px; margin: 20px 0 0;
    color: rgba(247,244,238,.92);
  }
  #cl-home .cl-pull cite { display: block; font-style: normal; font-family: 'Archivo', sans-serif; font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); margin-top: 10px; }

  /* ---------- Reviews (scoreboard + full review carousel) ---------- */
  #cl-home .cl-rev-head { display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; text-align: left; }
  #cl-home .cl-rev-head > b { font-size: clamp(42px, 5.4vw, 60px); font-weight: 900; color: var(--gold-deep); letter-spacing: -.04em; line-height: 1; white-space: nowrap; flex: none; }
  #cl-home .cl-stars { color: var(--gold); letter-spacing: 2px; font-size: 17px; }
  #cl-home .cl-rev-head small { display: block; font-size: 13.5px; font-weight: 600; color: rgba(18,16,12,.62); max-width: 34ch; }
  #cl-home .cl-platforms { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 20px; }
  #cl-home .cl-platforms span {
    padding: 8px 14px; border-radius: 999px; font-size: 12px; font-weight: 800; letter-spacing: .06em;
    background: #fff; border: 1px solid var(--line); color: var(--ink);
  }
  /* --- Review carousel: every review, in one scroll-snapping rail --- */
  #cl-home .cl-revcar { margin-top: 38px; position: relative; }
  #cl-home .cl-revcar-viewport { position: relative; }
  /* Soft fade at both edges so cards slide out of view instead of being chopped */
  #cl-home .cl-revcar-viewport::before,
  #cl-home .cl-revcar-viewport::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 64px; z-index: 3; pointer-events: none;
    transition: opacity .3s ease;
  }
  #cl-home .cl-revcar-viewport::before { left: -1px; background: linear-gradient(90deg, var(--paper-2), rgba(239,233,223,0)); }
  #cl-home .cl-revcar-viewport::after  { right: -1px; background: linear-gradient(270deg, var(--paper-2), rgba(239,233,223,0)); }
  #cl-home .cl-revcar[data-at="start"] .cl-revcar-viewport::before,
  #cl-home .cl-revcar[data-at="end"] .cl-revcar-viewport::after { opacity: 0; }

  /* The scroller itself carries the perspective, so every card is a plane in the
     same 3D space. (A scroll container is always transform-style: flat, so the
     depth has to come from the parent's perspective, not preserve-3d.) */
  #cl-home .cl-revcar-track {
    display: flex; gap: 18px; overflow-x: auto; scroll-snap-type: x mandatory;
    scroll-behavior: smooth; padding: 24px 0 44px; margin: -24px 0 -18px;
    scrollbar-width: none; -ms-overflow-style: none;
    perspective: 1500px; perspective-origin: 50% 46%;
  }
  #cl-home .cl-revcar-track::-webkit-scrollbar { display: none; }
  #cl-home .cl-rev-card {
    flex: 0 0 clamp(268px, 31.5%, 356px); scroll-snap-align: start;
    background: linear-gradient(155deg, #fff 0%, #fdfbf7 58%, #f6f1e8 100%);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 30px 26px 24px;
    display: flex; flex-direction: column; gap: 13px; position: relative; overflow: hidden;
    box-shadow: 0 24px 46px -30px rgba(18,16,12,.4);
    transform-origin: 50% 50%; backface-visibility: hidden;
    transition: box-shadow .5s var(--ease-out), border-color .5s;
  }
  /* Big serif quote mark, floated as the card's back layer */
  #cl-home .cl-rev-card::before {
    content: "\201C"; position: absolute; right: 14px; top: -22px; z-index: 0;
    font-family: 'Fraunces', Georgia, serif; font-size: 148px; line-height: 1;
    color: rgba(217,164,65,.15); pointer-events: none;
    transition: color .5s ease, transform .6s var(--ease-out);
  }
  /* Light sweeps across the card as it turns to face you — one pass, then gone,
     so it reads as a reflection rather than washing the card out */
  #cl-home .cl-rev-card::after {
    content: ""; position: absolute; inset: -20% -40%; z-index: 1; pointer-events: none; opacity: 0;
    background: linear-gradient(112deg, rgba(255,255,255,0) 38%, rgba(255,255,255,.85) 50%, rgba(255,255,255,0) 62%);
  }
  @keyframes cl-sheen {
    0%   { opacity: 0; transform: translateX(-42%); }
    22%  { opacity: 1; }
    100% { opacity: 0; transform: translateX(42%); }
  }
  #cl-home .cl-rev-card > * { position: relative; z-index: 2; }

  /* The card nearest the middle of the rail steps forward out of the wall */
  #cl-home .cl-rev-card.is-focus {
    border-color: rgba(217,164,65,.6);
    box-shadow: 0 46px 78px -34px rgba(18,16,12,.62), 0 0 0 1px rgba(217,164,65,.18);
  }
  #cl-home .cl-rev-card.is-focus::before { color: rgba(217,164,65,.3); transform: translateY(6px) rotate(-4deg); }
  #cl-home .cl-rev-card.is-focus::after { animation: cl-sheen 1.05s var(--ease-out) 1; }
  #cl-home .cl-rev-card:hover { border-color: rgba(217,164,65,.7); }
  #cl-home .cl-rev-card blockquote {
    font-family: 'Fraunces', Georgia, serif; font-style: italic; font-size: 15.5px; line-height: 1.55;
    color: var(--ink);
    display: -webkit-box; -webkit-line-clamp: 8; -webkit-box-orient: vertical; overflow: hidden;
    margin-block: auto;
  }
  #cl-home .cl-rev-card footer { margin-top: auto; padding-top: 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); }
  #cl-home .cl-rev-card cite { font-style: normal; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: rgba(18,16,12,.62); }
  #cl-home .cl-rev-src { flex: none; font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; padding: 5px 11px; border-radius: 999px; border: 1.5px solid rgba(217,164,65,.55); color: var(--gold-deep); background: rgba(217,164,65,.1); }

  /* Controls */
  #cl-home .cl-revcar-bar { display: flex; align-items: center; gap: 16px; margin-top: 6px; }
  #cl-home .cl-revcar-rail { flex: 1; height: 3px; border-radius: 999px; background: rgba(18,16,12,.13); overflow: hidden; }
  #cl-home .cl-revcar-rail i { display: block; height: 100%; width: 12%; border-radius: 999px; background: var(--gold-deep); transition: transform .35s var(--ease-out), width .35s var(--ease-out); }
  #cl-home .cl-revcar-count { font-size: 12.5px; font-weight: 800; letter-spacing: .1em; color: rgba(18,16,12,.6); flex: none; font-variant-numeric: tabular-nums; }
  #cl-home .cl-revcar-count b { color: var(--gold-deep); font-size: 15px; }
  #cl-home .cl-revcar-btns { display: flex; gap: 9px; flex: none; }
  #cl-home .cl-revcar-btns button {
    width: 44px; height: 44px; border-radius: 50%; cursor: pointer; font: inherit; font-size: 17px; line-height: 1;
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    display: grid; place-items: center;
    transition: background .3s, color .3s, border-color .3s, transform .3s var(--ease-out);
  }
  #cl-home .cl-revcar-btns button:hover:not(:disabled) { background: var(--ink); color: var(--paper); border-color: var(--ink); transform: translateY(-2px); }
  #cl-home .cl-revcar-btns button:disabled { opacity: .32; cursor: default; }

  /* ---------- Service area ---------- */
  #cl-home .cl-areas { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 26px; }
  #cl-home .cl-areas span {
    padding: 9px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 700;
    background: rgba(247,244,238,.06); border: 1px solid rgba(247,244,238,.18); color: var(--paper);
  }

  /* ---------- FAQ ---------- */
  #cl-home .cl-faq { max-width: 840px; margin: 36px auto 0; display: grid; gap: 12px; }
  #cl-home .cl-faq details { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 19px 22px; }
  #cl-home .cl-faq summary { font-weight: 800; font-size: 16.5px; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 14px; color: var(--ink); }
  #cl-home .cl-faq summary::-webkit-details-marker { display: none; }
  #cl-home .cl-faq summary::after { content: "+"; font-size: 22px; font-weight: 400; color: var(--gold-deep); }
  #cl-home .cl-faq details[open] summary::after { content: "\2013"; }
  #cl-home .cl-faq details p { margin-top: 11px; font-size: 15px; color: rgba(18,16,12,.75); }

  /* ---------- Final CTA (video) ---------- */
  #cl-home .cl-cta { position: relative; overflow: hidden; text-align: center; background: #0c0b10; color: var(--paper); }
  #cl-home .cl-cta .cl-scrim { background: linear-gradient(180deg, rgba(12,11,16,.88), rgba(12,11,16,.72) 50%, rgba(12,11,16,.93)); }
  #cl-home .cl-cta .cl-wrap { position: relative; z-index: 2; }
  #cl-home .cl-cta h2 em { font-style: normal; color: var(--gold); }
  #cl-home .cl-cta p { max-width: 54ch; margin: 14px auto 0; font-size: 16.5px; color: rgba(247,244,238,.85); }
  #cl-home .cl-cta small { display: block; margin-top: 18px; font-weight: 600; opacity: .72; }

  /* ---------- Lightbox ---------- */
  #cl-home .cl-lightbox {
    position: fixed; inset: 0; z-index: 9999; background: rgba(10,9,13,.95);
    display: none; align-items: center; justify-content: center; padding: 40px 20px;
  }
  #cl-home .cl-lightbox.is-open { display: flex; }
  #cl-home .cl-lightbox-close {
    position: absolute; top: 18px; right: 20px; z-index: 2; width: 44px; height: 44px; border-radius: 50%;
    border: 1.5px solid rgba(247,244,238,.4); background: rgba(255,255,255,.07); color: var(--paper);
    font-size: 22px; cursor: pointer; display: grid; place-items: center;
  }
  #cl-home .cl-lb-single img { max-width: min(94vw, 1100px); max-height: 86vh; object-fit: contain; border-radius: 10px; }
  #cl-home .cl-lightbox.is-compare .cl-lb-single { display: none; }
  #cl-home .cl-lb-compare { display: none; gap: 18px; max-width: 96vw; max-height: 90vh; align-items: center; }
  #cl-home .cl-lightbox.is-compare .cl-lb-compare { display: flex; }
  #cl-home .cl-lb-compare figure { position: relative; flex: 1 1 0; min-width: 0; }
  #cl-home .cl-lb-compare img { width: 100%; max-height: 84vh; object-fit: contain; border-radius: 10px; }
  #cl-home .cl-lb-compare figcaption {
    position: absolute; top: 14px; left: 14px; padding: 7px 14px; border-radius: 999px;
    background: rgba(12,11,16,.78); color: var(--paper); font-size: 11.5px; font-weight: 800;
    letter-spacing: .16em; text-transform: uppercase;
  }
  #cl-home .cl-lb-compare .cl-lb-after figcaption { color: var(--gold); }

  /* ---------- Squarespace host-page fixes ---------- */
  .page-section:has(#cl-home) { padding: 0 !important; min-height: 0 !important; }
  .page-section:has(#cl-home) > .content-wrapper { padding: 0 !important; max-width: none !important; width: 100% !important; }
  .sqs-block:has(#cl-home) { padding: 0 !important; }
  .sqs-block:has(#cl-home) .sqs-block-content { margin: 0 !important; }

  /* ---------- Phone layout ---------- */
  @media (max-width: 900px) {
    #cl-home .cl-svc-grid, #cl-home .cl-values, #cl-home .cl-process { grid-template-columns: 1fr; }
    #cl-home .cl-work { grid-template-columns: 1fr; }
    #cl-home .cl-owner { grid-template-columns: 1fr; }

    #cl-home .cl-stats-grid { grid-template-columns: repeat(2, 1fr); gap: 26px 12px; }
  }
  @media (max-width: 767px) {
    #cl-home { padding-bottom: calc(74px + env(safe-area-inset-bottom)); }
    #cl-home .cl-hero { min-height: 88vh; min-height: 100svh; padding: 104px 0 74px; }
    #cl-home .cl-hero { padding: 100px 22px 74px; }
    #cl-home .cl-hero h1 { font-size: clamp(34px, 10.5vw, 50px); }
    #cl-home .cl-logo { width: min(84vw, 380px); margin-bottom: 22px; }
    #cl-home .cl-owner-strip { grid-template-columns: repeat(3, 1fr); }
    #cl-home .cl-section { padding: 52px 0; }
    #cl-home .cl-wrap { padding: 0 22px; }
    /* Swipeable service + work rails */
    #cl-home .cl-svc-grid, #cl-home .cl-work {
      display: flex; gap: 13px; overflow-x: auto; scroll-snap-type: x mandatory;
      margin: 26px -22px 0; padding: 4px 22px 8px; scroll-padding-left: 22px;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    #cl-home .cl-svc-grid::-webkit-scrollbar, #cl-home .cl-work::-webkit-scrollbar { display: none; }
    #cl-home .cl-svc-card, #cl-home .cl-shot { flex: none; width: min(78vw, 320px); scroll-snap-align: start; }
    /* Review rail runs edge to edge on phones; the fades sit over the page padding */
    #cl-home .cl-revcar-track { margin: 0 -22px; padding: 6px 22px 26px; scroll-padding-left: 22px; -webkit-overflow-scrolling: touch; }
    #cl-home .cl-revcar-viewport::before, #cl-home .cl-revcar-viewport::after { width: 26px; }
    #cl-home .cl-rev-card { flex: 0 0 min(80vw, 330px); padding: 26px 22px 20px; }
    /* one card fills the screen here, so cap the tallest quote to keep the rail short */
    #cl-home .cl-rev-card blockquote { -webkit-line-clamp: 6; }
    #cl-home .cl-revcar-bar { gap: 12px; }
    #cl-home .cl-revcar-btns button { width: 40px; height: 40px; }
    /* the wide commercial card becomes a normal card in the swipe rail */
    #cl-home .cl-svc-card--wide { aspect-ratio: 4 / 3.1; }
    #cl-home .cl-btn { padding: 15px 26px; font-size: 14.5px; }
    #cl-home .cl-lb-compare { flex-direction: column; overflow-y: auto; max-height: 92vh; }
    #cl-home .cl-lb-compare img { max-height: 40vh; }
    /* Sticky thumb-reach action bar */
    #cl-home .cl-mbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 300; display: flex; gap: 8px;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      background: rgba(18,16,12,.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(217,164,65,.35);
