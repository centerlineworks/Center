<style>
  /* ============================================================
     SCHEDULE PAGE — deliberately NOT built like the other pages.
     No video hero, no centred logo-over-video stack, no alternating
     cream/dark bands. The whole page is one dark room in perspective:
     a lit floor, a rotating six-sided drum carrying the questions, and
     a work order that writes itself on a floating card beside it.
     ============================================================ */
  #cl-sched {
    --ink: #12100c; --paper: #f7f4ee; --paper-2: #efe9df;
    --gold: #d9a441; --gold-deep: #b07f22; --gold-lite: #f0cd86;
    --room: #0b0a0e; --room-2: #16141c;
    --line: rgba(247,244,238,.14);
    --ease-out: cubic-bezier(.16, 1, .3, 1);
    --face-w: 460px; --face-h: 430px;
    font-family: 'Archivo', system-ui, -apple-system, sans-serif;
    color: var(--paper); background: var(--room); line-height: 1.6;
    width: 100%; max-width: 100vw; overflow-x: hidden;
  }
  #cl-sched *, #cl-sched *::before, #cl-sched *::after { box-sizing: border-box; margin: 0; min-width: 0; }
  #cl-sched img { max-width: 100%; display: block; background-color: transparent; }
  #cl-sched :is(h1,h2,h3,h4,p,blockquote,summary,cite,small,li,figcaption,span,div,b,strong,em,label,legend,dt,dd) { color: inherit; }
  #cl-sched h1, #cl-sched h2, #cl-sched h3 { line-height: 1.04; font-weight: 800; letter-spacing: -.025em; }
  #cl-sched a { color: inherit; }
  #cl-sched .cl-kicker {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 11.5px; font-weight: 800; letter-spacing: .26em; text-transform: uppercase; color: var(--gold);
  }
  #cl-sched .cl-kicker::before { content: ""; width: 30px; height: 2px; background: var(--gold); }

  /* ---------- THE ROOM: one continuous lit 3D space ---------- */
  #cl-sched .cl-room {
    /* clip, not hidden: an overflow:hidden box can still be scrolled by the
       browser when something inside it takes focus, and the faces of the drum
       stick far out to the sides — that dragged the whole room sideways the
       moment a form field was focused */
    position: relative; overflow: hidden; overflow: clip;
    min-height: 100vh; min-height: 100svh;
    display: flex; align-items: center;
    padding: clamp(80px, 9vh, 130px) 0 clamp(60px, 7vh, 100px);
    background:
      radial-gradient(120% 90% at 72% 8%, rgba(217,164,65,.22), transparent 58%),
      radial-gradient(90% 70% at 8% 92%, rgba(217,164,65,.09), transparent 60%),
      linear-gradient(180deg, #16141c 0%, #0b0a0e 62%, #08070b 100%);
  }
  /* the floor: a grid receding to a horizon, drifting toward you */
  #cl-sched .cl-floor {
    position: absolute; left: 50%; bottom: 0; width: 300%; height: 56%; z-index: 0; pointer-events: none;
    transform: translateX(-50%) perspective(520px) rotateX(74deg);
    transform-origin: 50% 100%;
    background-image:
      linear-gradient(rgba(217,164,65,.20) 1px, transparent 1px),
      linear-gradient(90deg, rgba(217,164,65,.14) 1px, transparent 1px);
    background-size: 90px 90px;
    -webkit-mask-image: linear-gradient(180deg, transparent, #000 55%, rgba(0,0,0,.35));
    mask-image: linear-gradient(180deg, transparent, #000 55%, rgba(0,0,0,.35));
    animation: cl-floor 18s linear infinite;
  }
  @keyframes cl-floor { to { background-position: 0 900px, 0 0; } }
  /* ---------- THE MAP: real North Georgia, behind everything ----------
     Coordinates are the towns' actual latitude/longitude, projected flat, so
     the layout and the road corridors between them are true to the ground.
     The camera drifts from town to town on its own and locks onto whichever
     one the visitor picks on question two. */
  #cl-sched .cl-mapwrap {
    position: absolute; inset: 0; z-index: 0; overflow: hidden; overflow: clip; pointer-events: none;
    /* faintest where the words and the drum sit, strongest out at the edges,
       so the map reads as the room's wallpaper rather than a competing layer */
    /* faint right where the words and the drum sit, but left clear across the
       top band — that's where a picked town is flown to, so it has to read */
    -webkit-mask-image: radial-gradient(115% 78% at 50% 66%, rgba(0,0,0,.14), rgba(0,0,0,.45) 42%, #000 76%);
    mask-image: radial-gradient(115% 78% at 50% 66%, rgba(0,0,0,.14), rgba(0,0,0,.45) 42%, #000 76%);
  }
  /* No opacity on the <svg> itself — that would dim the picked pin along with
     everything else. Each layer carries its own alpha instead, so the town the
     visitor chose can come through at full strength over faint wallpaper. */
  #cl-sched .cl-map { position: absolute; inset: -6%; width: 112%; height: 112%; }
  #cl-sched .cl-map-cam { transition: transform 2.4s var(--ease-out); transform-origin: 0 0; }
  #cl-sched .cl-contour { fill: none; stroke: rgba(217,164,65,.04); stroke-width: 1.4; }
  #cl-sched .cl-road { fill: none; stroke: rgba(217,164,65,.13); stroke-width: 2.4; stroke-linecap: round; }
  #cl-sched .cl-pin-halo { fill: rgba(217,164,65,.04); transform: scale(.4); transform-origin: center;
    transition: transform .6s var(--ease-out), fill .6s ease; }
  #cl-sched .cl-pin-dot { fill: rgba(240,205,134,.2); r: 5; transition: fill .5s ease, r .5s var(--ease-out); }
  #cl-sched .cl-pin-label {
    font-family: 'Archivo', sans-serif; font-size: 13px; font-weight: 800; letter-spacing: .06em;
    text-anchor: middle; fill: rgba(247,244,238,.14); transition: fill .5s ease;
  }
  #cl-sched .cl-pin.is-live .cl-pin-dot { fill: rgba(240,205,134,.85); r: 7; }
  #cl-sched .cl-pin.is-live .cl-pin-label { fill: rgba(240,205,134,.7); }
  #cl-sched .cl-pin.is-live .cl-pin-halo { transform: scale(1.05); fill: rgba(217,164,65,.13); }
  #cl-sched .cl-pin.is-picked .cl-pin-dot { fill: #fff; r: 8; }
  #cl-sched .cl-pin.is-picked .cl-pin-label { fill: #fff; }
  #cl-sched .cl-pin.is-picked .cl-pin-halo { transform: scale(1.25); fill: rgba(217,164,65,.26); }
  /* the town the camera is on, named in the corner */
  #cl-sched .cl-map-tag {
    position: absolute; left: clamp(20px, 3vw, 40px); bottom: 22px; z-index: 2;
    display: inline-flex; align-items: center; gap: 9px; padding: 8px 15px; border-radius: 999px;
    font-size: 11.5px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase;
    color: var(--gold); background: rgba(11,10,14,.6); border: 1px solid rgba(217,164,65,.35);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  #cl-sched .cl-map-tag i { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); font-style: normal; }
  #cl-sched .cl-map-tag b { color: var(--paper); font-weight: 800; letter-spacing: .04em; text-transform: none; font-size: 13px; }

  /* a soft overhead light pooling on the drum */
  #cl-sched .cl-beam {
    position: absolute; top: -18%; right: 6%; width: 60%; height: 90%; z-index: 0; pointer-events: none;
    background: radial-gradient(50% 50% at 50% 50%, rgba(240,205,134,.16), transparent 70%);
    filter: blur(20px);
  }

  #cl-sched .cl-console {
    position: relative; z-index: 3; width: 100%; max-width: 1320px; margin: 0 auto;
    padding: 0 clamp(20px, 3vw, 40px);
    display: grid; grid-template-columns: minmax(0, .72fr) minmax(0, 1.28fr);
    grid-template-areas: "desk rig" "ticket rig";
    grid-template-rows: auto auto; align-content: center;
    column-gap: clamp(28px, 4vw, 64px); row-gap: 30px; align-items: center;
  }
  #cl-sched .cl-desk { grid-area: desk; align-self: end; }
  #cl-sched .cl-ticket-wrap { grid-area: ticket; align-self: start; }
  #cl-sched .cl-rig { grid-area: rig; }

  /* ---------- LEFT: the words + the live work order ---------- */
  #cl-sched .cl-logo, #cl-sched .cl-logo img {
    background: none !important; background-color: transparent !important;
    border: 0 !important; box-shadow: none !important; border-radius: 0 !important;
    padding: 0 !important; outline: 0 !important;
  }
  #cl-sched .cl-logo { display: block; width: clamp(150px, 15vw, 220px); margin: 0 0 26px; }
  #cl-sched .cl-logo img { width: 100%; height: auto; opacity: 0; transition: opacity .5s ease; }
  #cl-sched .cl-logo img.is-loaded { opacity: 1; }

  #cl-sched .cl-lede-h1 { font-size: clamp(36px, 4.6vw, 62px); font-weight: 900; margin: 14px 0 0; }
  #cl-sched .cl-lede-h1 .gold { color: var(--gold); display: block; }
  #cl-sched .cl-blurb { margin-top: 16px; font-size: clamp(15px, 1.35vw, 17px); color: rgba(247,244,238,.72); max-width: 44ch; }

  /* the work order writes itself as answers land */
  #cl-sched .cl-ticket-wrap { perspective: 1100px; }
  #cl-sched .cl-ticket {
    position: relative; border-radius: 16px; padding: 20px 22px 18px;
    background: linear-gradient(158deg, rgba(247,244,238,.10), rgba(247,244,238,.035));
    border: 1px solid var(--line); backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px);
    box-shadow: 0 40px 70px -40px rgba(0,0,0,.9);
    transform-style: preserve-3d; transition: transform .5s var(--ease-out);
  }
  #cl-sched .cl-ticket::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; border-radius: 3px 0 0 3px;
    background: linear-gradient(180deg, var(--gold-lite), var(--gold-deep));
  }
  #cl-sched .cl-ticket h2 {
    font-size: 11px; font-weight: 900; letter-spacing: .24em; text-transform: uppercase;
    color: var(--gold); margin-bottom: 14px;
  }
  #cl-sched .cl-ticket dl { display: grid; gap: 9px; }
  #cl-sched .cl-trow { display: grid; grid-template-columns: 92px 1fr; gap: 12px; align-items: baseline; }
  #cl-sched .cl-trow dt { font-size: 10.5px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: rgba(247,244,238,.42); }
  #cl-sched .cl-trow dd { font-size: 14.5px; font-weight: 700; color: rgba(247,244,238,.36); transition: color .4s ease; }
  #cl-sched .cl-trow.is-set dd { color: var(--paper); }
  #cl-sched .cl-trow.is-fresh dd { animation: cl-ink .55s var(--ease-out); }
  @keyframes cl-ink {
    0% { opacity: 0; transform: translateY(7px) rotateX(-55deg); }
    100% { opacity: 1; transform: none; }
  }
  #cl-sched .cl-ticket-foot {
    margin-top: 16px; padding-top: 14px; border-top: 1px dashed rgba(247,244,238,.2);
    display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: rgba(247,244,238,.55);
  }
  #cl-sched .cl-ticket-foot b { color: var(--gold); font-weight: 800; }

  /* ---------- RIGHT: the six-sided drum ---------- */
  #cl-sched .cl-rig { position: relative; }

  /* progress: little cubes that roll over to a tick when answered */
  #cl-sched .cl-cubes { display: flex; gap: 12px; justify-content: center; margin-bottom: 26px; perspective: 700px; }
  #cl-sched .cl-cube {
    width: 34px; height: 34px; position: relative; transform-style: preserve-3d; cursor: pointer;
    background: none; border: 0; padding: 0; font: inherit;
    transition: transform .55s var(--ease-out);
  }
  #cl-sched .cl-cube span {
    position: absolute; inset: 0; display: grid; place-items: center; border-radius: 9px;
    font-size: 13px; font-weight: 900; backface-visibility: hidden;
  }
  #cl-sched .cl-cube .f {
    background: rgba(247,244,238,.07); border: 1px solid var(--line); color: rgba(247,244,238,.55);
    transform: translateZ(17px);
  }
  #cl-sched .cl-cube .t {
    background: linear-gradient(140deg, var(--gold-lite), var(--gold-deep)); color: #17140c;
    transform: rotateX(90deg) translateZ(17px);
  }
  #cl-sched .cl-cube.is-done { transform: rotateX(-90deg); }
  #cl-sched .cl-cube.is-now .f { border-color: var(--gold); color: var(--gold); background: rgba(217,164,65,.16); box-shadow: 0 0 0 4px rgba(217,164,65,.12); }

  /* the drum itself.
     The hood clips the sides of the prism to its own column — without it the
     faces swinging round at 60 degrees reach out over the headline. Vertical
     padding + matching negative margin keeps the drop shadow from being cut. */
  #cl-sched .cl-drum-hood { overflow: hidden; overflow: clip; padding: 46px 0; margin: -46px 0; }
  #cl-sched .cl-drum { perspective: 1500px; perspective-origin: 50% 46%; }
  #cl-sched .cl-drum-body {
    position: relative; width: var(--face-w); height: var(--face-h); margin: 0 auto;
    transform-style: preserve-3d; transition: transform .85s var(--ease-out);
  }
  #cl-sched .cl-face {
    position: absolute; inset: 0; border-radius: 20px; padding: 30px 30px 26px;
    background: linear-gradient(162deg, rgba(255,253,248,.98), rgba(243,236,224,.95));
    color: var(--ink); border: 1px solid rgba(217,164,65,.35);
    box-shadow: 0 50px 90px -50px rgba(0,0,0,1), inset 0 1px 0 rgba(255,255,255,.9);
    display: flex; flex-direction: column; overflow: hidden;
    transition: opacity .5s ease, filter .5s ease;
    /* faces turned past 90 degrees drop out of sight entirely, and only the one
       facing you is clickable — otherwise the far side of the drum sits on top
       of the front face in hit testing and swallows every click */
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    pointer-events: none;
  }
  #cl-sched .cl-face.is-front { pointer-events: auto; }
  #cl-sched .cl-face:not(.is-front) { opacity: .28; filter: saturate(.4) brightness(.75); }
  #cl-sched .cl-face h3 { font-size: clamp(20px, 1.9vw, 27px); margin-bottom: 6px; }
  #cl-sched .cl-face .cl-hint { font-size: 13.5px; color: rgba(18,16,12,.6); margin-bottom: 16px; }
  #cl-sched .cl-face .cl-hint b { color: var(--gold-deep); font-weight: 800; }
  #cl-sched .cl-face-body { flex: 1; overflow-y: auto; overflow-x: hidden; padding-right: 4px; }
  #cl-sched .cl-face-body::-webkit-scrollbar { width: 6px; }
  #cl-sched .cl-face-body::-webkit-scrollbar-thumb { background: rgba(18,16,12,.18); border-radius: 99px; }

  /* option tiles inside a face */
  #cl-sched .cl-opts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; }
  #cl-sched .cl-opts--3 { grid-template-columns: repeat(3, 1fr); }
  #cl-sched .cl-opt {
    position: relative; text-align: left; cursor: pointer; font-family: inherit;
    font-size: 13.5px; font-weight: 800; color: var(--ink); line-height: 1.25;
    background: #fff; border: 2px solid rgba(18,16,12,.1); border-radius: 12px; padding: 12px 12px;
    transition: transform .28s var(--ease-out), border-color .28s, box-shadow .28s, background .28s;
    box-shadow: 0 8px 18px -14px rgba(18,16,12,.6);
  }
  #cl-sched .cl-opt small { display: block; margin-top: 3px; font-size: 11px; font-weight: 600; color: rgba(18,16,12,.5); }
  #cl-sched .cl-opt:hover { border-color: rgba(217,164,65,.75); }
  #cl-sched .cl-opt.is-on {
    border-color: var(--gold); background: linear-gradient(150deg, #fffdf8, #fbeed6);
    box-shadow: 0 16px 30px -18px rgba(176,127,34,.8);
  }
  #cl-sched .cl-opt.is-on::after {
    content: "✓"; position: absolute; top: 7px; right: 8px; width: 19px; height: 19px; border-radius: 50%;
    display: grid; place-items: center; font-size: 11px; background: var(--gold); color: #17140c;
    animation: cl-pop .35s var(--ease-out);
  }
  @keyframes cl-pop { from { transform: scale(0) rotate(-40deg); opacity: 0 } to { transform: none; opacity: 1 } }

  /* "Something else" — the tile spans the row and unfolds a box under the grid */
