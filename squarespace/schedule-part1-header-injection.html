<style>
  /* ---------- Design tokens (shared with Home, About + Services) ---------- */
  #cl-sched {
    --ink: #12100c; --paper: #f7f4ee; --paper-2: #efe9df;

    font-family: 'Archivo', system-ui, -apple-system, sans-serif;
    color: var(--ink); background: var(--paper); line-height: 1.6;
    width: 100%; max-width: 100vw; overflow-x: hidden;
  }
  #cl-sched *, #cl-sched *::before, #cl-sched *::after { box-sizing: border-box; margin: 0; min-width: 0; }
  /* Backgrounds belong on wrappers, never on the <img> — the theme paints one
     onto images inside code blocks and it shows through transparent PNGs. */
  #cl-sched img { max-width: 100%; display: block; background-color: transparent; }
  /* Theme-bleed guard: every text element inherits its section's colour */
  #cl-sched :is(h1,h2,h3,h4,p,blockquote,summary,cite,small,li,figcaption,span,div,b,strong,em,label,legend) { color: inherit; }
  #cl-sched .cl-wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }
  #cl-sched h1, #cl-sched h2, #cl-sched h3 { line-height: 1.06; font-weight: 800; letter-spacing: -.02em; }
  #cl-sched .cl-serif { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-style: italic; }
  #cl-sched a { color: inherit; }

  #cl-sched .cl-kicker {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 12.5px; font-weight: 800; letter-spacing: .24em; text-transform: uppercase;
    color: var(--gold-deep); margin-bottom: 14px;
  }
  #cl-sched .cl-kicker::before { content: ""; width: 32px; height: 2px; background: var(--gold); }
  #cl-sched .cl-section { padding: clamp(58px, 7vw, 100px) 0; position: relative; }
  #cl-sched .cl-section h2 { font-size: clamp(29px, 4.4vw, 48px); margin-bottom: 14px; }
  #cl-sched .cl-lede { font-size: clamp(16px, 2vw, 19px); max-width: 62ch; color: rgba(18,16,12,.78); }
  #cl-sched .cl-dark { background: linear-gradient(180deg, #17161c, #0f0e13); color: var(--paper); }
  #cl-sched .cl-dark .cl-kicker { color: var(--gold); }
  #cl-sched .cl-dark .cl-lede { color: rgba(247,244,238,.8); }

  /* ---------- Buttons ---------- */
  #cl-sched .cl-btn {
    display: inline-block; padding: 17px 36px; border-radius: 999px; text-decoration: none; cursor: pointer;
    font-family: inherit; font-weight: 800; font-size: 15.5px; letter-spacing: .01em; border: 0;
    background: #17161c; color: var(--paper);
    transition: transform .3s var(--ease-out), box-shadow .3s, background .3s, color .3s, border-color .3s;
    box-shadow: 0 20px 40px -18px rgba(18,16,12,.5);
  }
  #cl-sched .cl-btn:hover { transform: translateY(-3px); }
  #cl-sched .cl-btn--gold { background: linear-gradient(140deg, var(--gold), var(--gold-deep)); color: #17140c; box-shadow: 0 20px 40px -16px rgba(176,127,34,.65); }
  #cl-sched .cl-btn--ghost { background: transparent; border: 2px solid rgba(247,244,238,.42); color: var(--paper); box-shadow: none; }
  #cl-sched .cl-btn--ghost:hover { border-color: var(--gold); color: var(--gold); }
  #cl-sched .cl-btn--dark-ghost { background: transparent; border: 2px solid var(--line); color: var(--ink); box-shadow: none; }
  #cl-sched .cl-btn--dark-ghost:hover { border-color: var(--gold); color: var(--gold-deep); }
  #cl-sched .cl-btn-row { display: flex; flex-wrap: wrap; gap: 13px; margin-top: 28px; }
  #cl-sched .cl-btn-row--center { justify-content: center; }

  /* ---------- Reveal on scroll ---------- */
  #cl-sched .cl-reveal {
    opacity: 0; transform: perspective(900px) rotateX(7deg) translateY(34px);
    transition: opacity .8s var(--ease-out), transform .8s var(--ease-out);
  }
  #cl-sched .cl-reveal.is-in { opacity: 1; transform: perspective(900px) rotateX(0) translateY(0); }

  /* ---------- HERO ---------- */
  #cl-sched .cl-hero {
    position: relative; min-height: 74vh; display: flex; align-items: center; justify-content: center;
    text-align: center; overflow: hidden; padding: 110px 24px 84px; color: var(--paper);
    background: #0f0e13;
  }
  #cl-sched .cl-video-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }

  }
  /* A slow 3D perspective grid drifting under the hero — the "site plan" motif */
  #cl-sched .cl-grid3d {
    position: absolute; left: 50%; bottom: -6%; z-index: 1; width: 240%; height: 62%;
    transform: translateX(-50%) perspective(560px) rotateX(70deg);
    background-image:
      linear-gradient(rgba(217,164,65,.20) 1px, transparent 1px),
      linear-gradient(90deg, rgba(217,164,65,.20) 1px, transparent 1px);
    background-size: 74px 74px;
    -webkit-mask-image: linear-gradient(180deg, transparent, #000 42%, transparent);

  @keyframes cl-grid { to { background-position: 0 740px, 0 0; } }
  #cl-sched .cl-hero-inner { position: relative; z-index: 3; width: 100%; max-width: 940px; }
  #cl-sched .cl-logo, #cl-sched .cl-logo img {

  }
  #cl-sched .cl-logo { display: block; width: clamp(190px, 26vw, 330px); margin: 0 auto 26px; }

  #cl-sched .cl-logo img.is-loaded { opacity: 1; }

  #cl-sched .cl-hero h1 { font-size: clamp(38px, 6.4vw, 76px); font-weight: 900; letter-spacing: -.03em; }
  #cl-sched .cl-hero h1 .ln { display: block; }
  #cl-sched .cl-hero h1 .gold { color: var(--gold); }
  #cl-sched .cl-hero-sub {
    margin: 20px auto 0; max-width: 60ch; font-size: clamp(15.5px, 1.9vw, 19px); color: rgba(247,244,238,.85);
  }
  #cl-sched .cl-trustchips { display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; margin-top: 26px; }
  #cl-sched .cl-trustchips > span {
    display: inline-flex; align-items: center; gap: 7px; padding: 9px 15px; border-radius: 999px;
    font-size: 12.5px; font-weight: 800; letter-spacing: .02em;
    color: var(--paper); background: rgba(12,11,16,.5); border: 1px solid rgba(217,164,65,.5);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  #cl-sched .cl-trustchips b { color: var(--gold); font-weight: 900; }

  /* ================= THE 3D BOOKING DECK ================= */
  #cl-sched .cl-booker { background: var(--paper-2); }
  #cl-sched .cl-booker-head { text-align: center; margin-bottom: 30px; }
  #cl-sched .cl-booker-head .cl-kicker { justify-content: center; }

  /* Progress rail */
  #cl-sched .cl-steps {
    display: flex; align-items: center; gap: 0; max-width: 760px; margin: 0 auto 30px; padding: 0 4px;
  }
  #cl-sched .cl-step-dot {
    flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
    font-size: 12.5px; font-weight: 900; cursor: pointer; position: relative;
    background: #fff; color: rgba(18,16,12,.42); border: 2px solid var(--line);
    transition: transform .4s var(--ease-out), background .4s, color .4s, border-color .4s, box-shadow .4s;
  }
  #cl-sched .cl-step-dot:disabled { cursor: default; }
  #cl-sched .cl-step-dot.is-done { background: var(--gold); border-color: var(--gold); color: #17140c; }
  #cl-sched .cl-step-dot.is-now {
    background: #17161c; border-color: #17161c; color: var(--gold); transform: scale(1.18);
    box-shadow: 0 12px 26px -12px rgba(18,16,12,.8);
  }
  #cl-sched .cl-step-line { flex: 1; height: 3px; background: var(--line); border-radius: 999px; overflow: hidden; }
  #cl-sched .cl-step-line i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .5s var(--ease-out); }

  /* The stage: every card is a plane in one perspective */
  #cl-sched .cl-stage {
    position: relative; perspective: 1600px; perspective-origin: 50% 44%;
    max-width: 880px; margin: 0 auto; transition: height .5s var(--ease-out);
  }
  #cl-sched .cl-card {
    position: absolute; inset: 0 0 auto 0; width: 100%;
    background: linear-gradient(158deg, #fff 0%, #fdfbf7 60%, #f5efe5 100%);
    border: 1px solid var(--line); border-radius: 22px; padding: clamp(24px, 3.4vw, 42px);
    box-shadow: 0 40px 80px -40px rgba(18,16,12,.55);
    transform-origin: 50% 50%; backface-visibility: hidden;
    transition: transform .62s var(--ease-out), opacity .5s ease, visibility .62s;
    visibility: hidden; opacity: 0; pointer-events: none;
  }
  #cl-sched .cl-card.is-active {
    visibility: visible; opacity: 1; pointer-events: auto; z-index: 3;
    transform: none;
  }
  /* cards waiting ahead sit turned away to the right, spent cards to the left */
  #cl-sched .cl-card.is-ahead { transform: translateX(16%) rotateY(-34deg) translateZ(-300px) scale(.94); }
  #cl-sched .cl-card.is-behind { transform: translateX(-16%) rotateY(34deg) translateZ(-300px) scale(.94); }

  #cl-sched .cl-card h3 { font-size: clamp(22px, 3vw, 31px); margin-bottom: 8px; }
  #cl-sched .cl-card .cl-hint { font-size: 14.5px; color: rgba(18,16,12,.62); margin-bottom: 22px; }
  #cl-sched .cl-card .cl-hint b { color: var(--gold-deep); font-weight: 800; }

  /* Option tiles — the big 3D pickers */
  #cl-sched .cl-opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  #cl-sched .cl-opts--2 { grid-template-columns: repeat(2, 1fr); }
  #cl-sched .cl-opt {
    position: relative; display: flex; flex-direction: column; gap: 5px; text-align: left; cursor: pointer;
    font-family: inherit; font-size: 15px; font-weight: 800; color: var(--ink);
    background: #fff; border: 2px solid var(--line); border-radius: 15px; padding: 17px 16px;
    transform-style: preserve-3d;
    transition: transform .3s var(--ease-out), border-color .3s, box-shadow .3s, background .3s;
    box-shadow: 0 12px 26px -20px rgba(18,16,12,.6);
  }
  #cl-sched .cl-opt small { font-size: 12px; font-weight: 600; color: rgba(18,16,12,.55); letter-spacing: .01em; }
  #cl-sched .cl-opt:hover { border-color: rgba(217,164,65,.7); box-shadow: 0 22px 40px -24px rgba(18,16,12,.65); }
  #cl-sched .cl-opt.is-on {

  }
  #cl-sched .cl-opt.is-on::after {
    content: "✓"; position: absolute; top: 10px; right: 12px; width: 22px; height: 22px; border-radius: 50%;
    display: grid; place-items: center; font-size: 12px; font-weight: 900;
    background: var(--gold); color: #17140c;
    animation: cl-pop .35s var(--ease-out);
  }
  @keyframes cl-pop { from { transform: scale(0) rotate(-40deg); opacity: 0 } to { transform: none; opacity: 1 } }

  /* Fields */
  #cl-sched .cl-fields { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  #cl-sched .cl-field { display: flex; flex-direction: column; gap: 6px; }
  #cl-sched .cl-field--wide { grid-column: 1 / -1; }
  #cl-sched .cl-field label { font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: rgba(18,16,12,.6); }
  #cl-sched .cl-field label span { color: var(--gold-deep); }
  #cl-sched .cl-field :is(input, textarea, select) {
    font-family: inherit; font-size: 15.5px; color: var(--ink); background: #fff;

  #cl-sched .cl-field :is(input, textarea, select):focus {

  #cl-sched .cl-card-foot { display: flex; align-items: center; gap: 12px; margin-top: 26px; flex-wrap: wrap; }
  #cl-sched .cl-card-foot .cl-spacer { flex: 1; }
  #cl-sched .cl-back {

  #cl-sched .cl-back:hover { color: var(--gold-deep); }
  #cl-sched .cl-skip { font-size: 13px; font-weight: 700; color: rgba(18,16,12,.45); }

  /* Review card */
  #cl-sched .cl-summary { display: grid; gap: 2px; border: 2px solid var(--line); border-radius: 15px; overflow: hidden; background: #fff; }
  #cl-sched .cl-sum-row { display: grid; grid-template-columns: 150px 1fr; gap: 14px; padding: 13px 17px; background: #fff; }

    background: linear-gradient(150deg, #fffdf8, #fdf2dd); border: 2px solid var(--gold);
